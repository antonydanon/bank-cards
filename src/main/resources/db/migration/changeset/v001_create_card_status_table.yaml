databaseChangeLog:
  - changeSet:
      id: v001-create-card-status-table
      author: antonydanon
      changes:
        - createTable:
            tableName: card_statuses
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(20)
                  constraints:
                    nullable: false
                    unique: true