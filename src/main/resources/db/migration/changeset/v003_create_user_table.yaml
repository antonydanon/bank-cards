databaseChangeLog:
  - changeSet:
      id: v003-create-user-table
      author: antonydanon
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: boolean
                  defaultValue: true
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: bigserial
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_role
                    references: roles(id)